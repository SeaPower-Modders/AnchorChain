name: Preloader unchanged

on:
  pull_request:

permissions:
  contents: read

jobs:
  preloader-unchanged:
    name: Preloader unchanged
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject preloader changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changes=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" -- AnchorChain.Preloader/)
          if [[ -n "$changes" ]]; then
            echo "::error::The preloader DLL is not distributed via the Steam Workshop, so old versions will remain installed on people's systems. AnchorChain must remain compatible with old versions of the preloader. Preloader changes and updates should be avoided at all costs."
            printf '%s\n' "$changes"
            exit 1
          fi
